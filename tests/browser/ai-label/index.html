<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test DOM · badge IA</title>
  <link rel="stylesheet" href="../../../src/content.css?v=0.1.6">
  <style>
    :root { color-scheme: dark; font: 15px/1.5 system-ui; background: #000; color: #e7e9ea; }
    body { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
    button { padding: 8px 16px; cursor: pointer; }
    #examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    article { border: 1px solid #2f3336; padding: 18px; position: relative; }
    [data-testid="tweetText"] { padding-block: 12px; }
    [data-testid="tweetPhoto"] { height: 140px; display: grid; place-items: center; background: #263541; }
    .ai-label { display: flex; gap: 6px; align-items: center; color: #8b98a5; }
    .ai-label svg { width: 20px; height: 20px; fill: currentColor; }
    a { color: #8b98a5; } h1 { font-size: 24px; }
    #results { font-size: 13px; } .pass { color: #34d399; } .fail { color: #ff4050; }
  </style>
</head>
<body>
  <h1>Badge X « Made with AI » — règle locale</h1>
  <p>Vrai content script. Réponses API simulées à 5 %, aucune clé ni requête externe.</p>
  <button id="run">Lancer les tests DOM</button>
  <p id="summary">Prêt</p>
  <div id="examples"></div>
  <ol id="results"></ol>
  <script src="harness.js"></script>
  <script src="../../../src/content.js?v=0.1.6"></script>
</body>
</html>
